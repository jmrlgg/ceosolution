# nginx site config for Your CEO Solution (static Astro build).
#
# 1. Build locally:      npm run build
# 2. Upload dist/ to:    /var/www/your-ceo-solution   (contents of dist, not the folder itself)
# 3. Copy this file to:  /etc/nginx/sites-available/your-ceo-solution
#    and link it:        ln -s /etc/nginx/sites-available/your-ceo-solution /etc/nginx/sites-enabled/
# 4. Test and reload:    nginx -t && systemctl reload nginx
# 5. HTTPS:              certbot --nginx -d yourceosolution.com -d www.yourceosolution.com

# Send the bare domain to www.
server {
    listen 80;
    listen [::]:80;
    server_name yourceosolution.com;
    return 301 https://www.yourceosolution.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yourceosolution.com;

    root /var/www/your-ceo-solution;
    index index.html;

    # Old GoHighLevel URLs -> new pages (real 301s, better for SEO than the meta-refresh pages Astro generates).
    location = /home-179197         { return 301 /; }
    location = /about-516730        { return 301 /about/; }
    location = /services-new        { return 301 /work-with-us/; }
    location = /book-a-consultation { return 301 /contact/; }

    # Pages are built as /about/index.html etc., so try the file, then the folder.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro's hashed CSS/JS/images never change under the same name: cache them for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Videos and PDFs: cache for a week. nginx handles range requests, so video seeking works.
    location ~* \.(mp4|pdf|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;
}
